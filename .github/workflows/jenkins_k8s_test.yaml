name: jenkins-k8s Tests

on:
  pull_request:
    paths:
      - 'charms/jenkins-k8s/**'
      - '.github/workflows/jenkins_k8s_test.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  unit-tests:
    uses: canonical/operator-workflows/.github/workflows/test.yaml@main
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
    with:
      working-directory: charms/jenkins-k8s
      with-uv: true
