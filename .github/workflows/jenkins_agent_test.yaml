name: jenkins-agent Tests

on:
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.charm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            charm:
              - 'charms/jenkins-agent/**'
              - '.github/workflows/jenkins_agent_test.yaml'

  unit-tests:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.changed == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    uses: canonical/operator-workflows/.github/workflows/test.yaml@main
    secrets: inherit
    with:
      working-directory: charms/jenkins-agent
      self-hosted-runner: false
      vale-style-check: false
      with-uv: true

  required-status:
    name: jenkins-agent test required status
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - unit-tests
    if: always() && !cancelled()
    timeout-minutes: 5
    steps:
      - name: Verify unit-tests result
        run: |
          R='${{ needs.unit-tests.result }}'
          if [ "$R" = "success" ] || [ "$R" = "skipped" ]; then
            echo "unit-tests: $R"; exit 0
          fi
          echo "unit-tests concluded: $R"; exit 1
