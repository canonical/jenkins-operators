name: jenkins-k8s Publish to edge

on:
  push:
    branches:
      - main
    paths:
      - 'charms/jenkins-k8s/**'
      - '.github/workflows/jenkins_k8s_publish.yaml'

jobs:
  publish-to-edge:
    uses: canonical/operator-workflows/.github/workflows/publish_charm.yaml@main
    permissions:
      actions: read
      contents: write
    secrets: inherit
    with:
      working-directory: charms/jenkins-k8s
      tag-prefix: jenkins-k8s
      integration-test-workflow-file: jenkins_k8s_integration.yaml
