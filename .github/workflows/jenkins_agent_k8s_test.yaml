name: jenkins-agent-k8s Tests

on:
  pull_request:
    paths:
      - 'charms/jenkins-agent-k8s/**'
      - '.github/workflows/jenkins_agent_k8s_test.yaml'

jobs:
  unit-tests:
    permissions:
      contents: read
      pull-requests: write
    uses: canonical/operator-workflows/.github/workflows/test.yaml@main
    secrets: inherit
    with:
      working-directory: charms/jenkins-agent-k8s
      with-uv: true
