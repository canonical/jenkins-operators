name: jenkins-k8s integration tests

on:
  pull_request:
    paths:
      - 'charms/jenkins-k8s/**'
      - '.github/workflows/jenkins_k8s_*.yaml'
  schedule:
    - cron: "0 15 * * SAT"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  integration-tests:
    name: integration-tests-jenkins-k8s
    uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    secrets: inherit
    permissions:
      contents: read
      packages: write
      pull-requests: write
    with:
      identifier: jenkins-k8s
      build-context: charms/jenkins-k8s
      charm-directory: .
      channel: 1.34-strict/stable
      test-tox-env: jenkins-k8s-integration
      extra-arguments: |
        --kube-config=${GITHUB_WORKSPACE}/kube-config
      modules: '["test_auth_proxy.py", "test_cos.py", "test_ingress.py", "test_jenkins.py", "test_k8s_agent.py", "test_machine_agent.py", "test_plugins_part_1.py", "test_plugins_part_2.py", "test_proxy.py", "test_upgrade.py", "test_external_agent.py", "test_haproxy_route.py"]'
      pre-run-script: |
        -c "sudo microk8s config > ${GITHUB_WORKSPACE}/kube-config
        chmod +x charms/jenkins-k8s/tests/integration/pre_run_script.sh
        ./charms/jenkins-k8s/tests/integration/pre_run_script.sh"
      juju-channel: 3/stable
      microk8s-addons: "dns ingress rbac hostpath-storage registry"
      with-uv: true

  required-status-checks:
    name: Required Integration Test Status Checks - jenkins-k8s
    runs-on: ubuntu-latest
    needs:
      - integration-tests
    if: always() && !cancelled()
    timeout-minutes: 5
    steps:
      - run: |
          [ '${{ needs.integration-tests.result }}' = 'success' ] || (echo integration-tests failed && false)
