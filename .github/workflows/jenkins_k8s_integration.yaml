name: jenkins-k8s Integration tests

on:
  pull_request:
  schedule:
    - cron: "0 15 * * SAT"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.charm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            charm:
              - 'charms/jenkins-k8s/**'
              - '.github/workflows/jenkins_k8s_integration.yaml'

  integration-tests:
    needs: detect-changes
    if: ${{ github.event_name == 'schedule' || needs.detect-changes.outputs.changed == 'true' }}
    uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    secrets: inherit
    permissions:
      contents: read
      packages: write
      pull-requests: write
    with:
      working-directory: charms/jenkins-k8s
      test-tox-env: integration
      channel: 1.34-strict/stable
      extra-arguments: |
        --kube-config=${GITHUB_WORKSPACE}/kube-config
      modules: '["test_auth_proxy.py", "test_cos.py", "test_ingress.py", "test_jenkins.py", "test_k8s_agent.py", "test_machine_agent.py", "test_plugins_part_1.py", "test_plugins_part_2.py", "test_proxy.py", "test_upgrade.py", "test_external_agent.py", "test_haproxy_route.py"]'
      pre-run-script: |
        -c "sudo microk8s config > ${GITHUB_WORKSPACE}/kube-config
        chmod +x ${GITHUB_WORKSPACE}/charms/jenkins-k8s/tests/integration/pre_run_script.sh
        ${GITHUB_WORKSPACE}/charms/jenkins-k8s/tests/integration/pre_run_script.sh"
      juju-channel: 3/stable
      microk8s-addons: "dns ingress rbac hostpath-storage registry"
      upload-image: artifact
      with-uv: true

  allure-report:
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    needs:
      - integration-tests
    uses: canonical/operator-workflows/.github/workflows/allure_report.yaml@main

  required-status:
    name: jenkins-k8s integration required status
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - integration-tests
    if: always() && !cancelled()
    timeout-minutes: 5
    steps:
      - name: Verify integration-tests result
        run: |
          R='${{ needs.integration-tests.result }}'
          if [ "$R" = "success" ] || [ "$R" = "skipped" ]; then
            echo "integration-tests: $R"; exit 0
          fi
          echo "integration-tests concluded: $R"; exit 1
