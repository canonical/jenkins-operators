name: jenkins-agent integration tests

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'charms/jenkins-agent/**'
      - '.github/workflows/jenkins_agent_*.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      charm: ${{ steps.filter.outputs.charm }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            charm:
              - 'charms/jenkins-agent/**'
            workflow:
              - '.github/workflows/jenkins_agent_*.yaml'

  integration-tests-jenkins-agent-amd64:
    name: integration-tests-jenkins-agent-amd64
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.charm == 'true' || needs.changes.outputs.workflow == 'true'
    permissions:
      contents: read
      packages: write
    uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    secrets: inherit
    with:
      identifier: jenkins-agent-amd64
      build-context: charms/jenkins-agent
      charm-directory: .
      test-tox-env: jenkins-agent-integration
      pre-run-script: charms/jenkins-agent/tests/integration/setup_microk8s.sh
      juju-channel: 3/stable
      channel: 1.34-strict/edge
      self-hosted-runner: true
      with-uv: true

  integration-tests-jenkins-agent-non-amd64:
    name: integration-tests-jenkins-agent-non-amd64
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.charm == 'true' || needs.changes.outputs.workflow == 'true'
    strategy:
      matrix:
        runtime: [s390x, arm64, ppc64le]
    permissions:
      contents: read
      packages: write
    uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    secrets: inherit
    with:
      identifier: jenkins-agent-non-amd64-${{ matrix.runtime }}
      build-context: charms/jenkins-agent
      charm-directory: .
      test-tox-env: jenkins-agent-integration
      juju-channel: 3/stable
      provider: lxd
      extra-arguments: "--use-docker"
      builder-runner-label: ${{ matrix.runtime }}
      self-hosted-runner: true
      self-hosted-runner-arch: ${{ matrix.runtime }}
      self-hosted-runner-label: ${{ matrix.runtime }}
      with-uv: true

  required-status-checks:
    name: Required Integration Test Status Checks - jenkins-agent
    runs-on: ubuntu-latest
    needs:
      - integration-tests-jenkins-agent-amd64
    if: always() && !cancelled()
    timeout-minutes: 5
    steps:
      - run: |
          [ '${{ needs.integration-tests-jenkins-agent-amd64.result }}' = 'success' ] || [ '${{ needs.integration-tests-jenkins-agent-amd64.result }}' = 'skipped' ] || (echo amd64 integration tests failed && false)
