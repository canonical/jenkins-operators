name: jenkins-agent Integration tests

on:
  pull_request:
  schedule:
    - cron: "0 15 * * SAT"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.charm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            charm:
              - 'charms/jenkins-agent/**'
              - '.github/workflows/jenkins_agent_integration.yaml'

  integration-tests-amd64:
    needs: detect-changes
    if: ${{ github.event_name == 'schedule' || needs.detect-changes.outputs.changed == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    with:
      working-directory: charms/jenkins-agent
      test-tox-env: integration
      pre-run-script: ${GITHUB_WORKSPACE}/charms/jenkins-agent/tests/integration/setup_microk8s.sh
      juju-channel: 3/stable
      channel: 1.34-strict/edge
      self-hosted-runner: true
      with-uv: true

  integration-tests-non-amd64:
    needs: detect-changes
    if: ${{ github.event_name == 'schedule' || needs.detect-changes.outputs.changed == 'true' }}
    strategy:
      matrix:
        runtime: [s390x, arm64, ppc64le]
    permissions:
      contents: read
      packages: write
    uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    with:
      working-directory: charms/jenkins-agent
      test-tox-env: integration
      juju-channel: 3/stable
      provider: lxd
      extra-arguments: "--use-docker"
      builder-runner-label: ${{ matrix.runtime }}
      self-hosted-runner: true
      self-hosted-runner-arch: ${{ matrix.runtime }}
      self-hosted-runner-label: ${{ matrix.runtime }}
      with-uv: true

  allure-report:
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    needs:
      - integration-tests-amd64
      - integration-tests-non-amd64
    uses: canonical/operator-workflows/.github/workflows/allure_report.yaml@main

  required-status:
    name: jenkins-agent integration required status
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - integration-tests-amd64
      - integration-tests-non-amd64
    if: always() && !cancelled()
    timeout-minutes: 5
    steps:
      - name: Verify integration-tests results
        run: |
          AMD='${{ needs.integration-tests-amd64.result }}'
          NON='${{ needs.integration-tests-non-amd64.result }}'
          fail=0
          for pair in "amd64:$AMD" "non-amd64:$NON"; do
            name="${pair%%:*}"; res="${pair##*:}"
            if [ "$res" = "success" ] || [ "$res" = "skipped" ]; then
              echo "integration-tests-$name: $res"
            else
              echo "integration-tests-$name concluded: $res"; fail=1
            fi
          done
          exit $fail
