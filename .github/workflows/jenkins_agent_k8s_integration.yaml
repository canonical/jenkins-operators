name: jenkins-agent-k8s Integration tests

on:
  pull_request:
  schedule:
    - cron: "0 15 * * SAT"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.charm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            charm:
              - 'charms/jenkins-agent-k8s/**'
              - '.github/workflows/jenkins_agent_k8s_integration.yaml'

  integration-tests:
    needs: detect-changes
    if: ${{ github.event_name == 'schedule' || needs.detect-changes.outputs.changed == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    secrets: inherit
    with:
      working-directory: charms/jenkins-agent-k8s
      test-tox-env: integration
      pre-run-script: |
        -c "sudo microk8s config > ${GITHUB_WORKSPACE}/kube-config
        chmod +x ${GITHUB_WORKSPACE}/charms/jenkins-agent-k8s/tests/integration/pre_run_script.sh
        ${GITHUB_WORKSPACE}/charms/jenkins-agent-k8s/tests/integration/pre_run_script.sh"
      extra-arguments: |
        --kube-config=${GITHUB_WORKSPACE}/kube-config
      modules: '["test_agent_k8s.py"]'
      juju-channel: 3/stable
      channel: 1.35-strict/stable
      self-hosted-runner: true
      self-hosted-runner-label: "xlarge"
      microk8s-addons: "dns ingress rbac storage registry"
      upload-image: artifact
      with-uv: true

  allure-report:
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    needs:
      - integration-tests
    uses: canonical/operator-workflows/.github/workflows/allure_report.yaml@main

  required-status:
    name: jenkins-agent-k8s integration required status
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - integration-tests
    if: always() && !cancelled()
    timeout-minutes: 5
    steps:
      - name: Verify integration-tests result
        run: |
          R='${{ needs.integration-tests.result }}'
          if [ "$R" = "success" ] || [ "$R" = "skipped" ]; then
            echo "integration-tests: $R"; exit 0
          fi
          echo "integration-tests concluded: $R"; exit 1
