name: jenkins-agent-k8s integration tests

on:
  pull_request:
    paths:
      - 'charms/jenkins-agent-k8s/**'
      - '.github/workflows/jenkins_agent_k8s_*.yaml'
  schedule:
    - cron: "0 15 * * SAT"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  integration-tests:
    name: integration-tests
    uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    secrets: inherit
    permissions:
      contents: read
      packages: write
      pull-requests: write
    with:
      build-context: charms/jenkins-agent-k8s
      charm-directory: .
      pre-run-script: |
        -c "sudo microk8s config > ${GITHUB_WORKSPACE}/kube-config
        chmod +x tests/integration/pre_run_script.sh
        ./tests/integration/pre_run_script.sh"
      extra-arguments: |
        --kube-config=${GITHUB_WORKSPACE}/kube-config
      modules: '["test_agent_k8s.py"]'
      juju-channel: 3/stable
      channel: 1.35-strict/stable
      self-hosted-runner: true
      self-hosted-runner-label: "xlarge"
      microk8s-addons: "dns ingress rbac storage registry"
      with-uv: true
