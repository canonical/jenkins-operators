name: jenkins-agent-k8s integration tests

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'charms/jenkins-agent-k8s/**'
      - '.github/workflows/jenkins_agent_k8s_*.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      charm: ${{ steps.filter.outputs.charm }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            charm:
              - 'charms/jenkins-agent-k8s/**'
            workflow:
              - '.github/workflows/jenkins_agent_k8s_*.yaml'

  integration-tests-jenkins-agent-k8s:
    name: integration-tests-jenkins-agent-k8s
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.charm == 'true' || needs.changes.outputs.workflow == 'true'
    uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    secrets: inherit
    permissions:
      contents: read
      packages: write
      pull-requests: write
    with:
      identifier: jenkins-agent-k8s
      working-directory: charms/jenkins-agent-k8s
      test-tox-env: jenkins-agent-k8s-integration
      upload-image: artifact
      pre-run-script: |
        -c "sudo microk8s config > ${GITHUB_WORKSPACE}/kube-config
        chmod +x tests/integration/pre_run_script.sh
        ./tests/integration/pre_run_script.sh"
      extra-arguments: |
        --kube-config=${GITHUB_WORKSPACE}/kube-config
      modules: '["test_agent_k8s.py"]'
      juju-channel: 3/stable
      channel: 1.35-strict/stable
      self-hosted-runner: true
      self-hosted-runner-label: "xlarge"
      microk8s-addons: "dns ingress rbac storage registry"
      with-uv: true

  required-status-checks:
    name: Required Integration Test Status Checks - jenkins-agent-k8s
    runs-on: ubuntu-latest
    needs:
      - integration-tests-jenkins-agent-k8s
    if: always() && !cancelled()
    timeout-minutes: 5
    steps:
      - run: |
          [ '${{ needs.integration-tests-jenkins-agent-k8s.result }}' = 'success' ] || [ '${{ needs.integration-tests-jenkins-agent-k8s.result }}' = 'skipped' ] || (echo integration tests failed && false)
