[tox]
envlist = lint, unit, static, coverage-report
skipsdist = true
skip_missing_interpreters = true

[testenv:lint]
commands = tox -c {toxinidir}/../../tox.ini -e jenkins-agent-k8s-lint {posargs}

[testenv:unit]
commands = tox -c {toxinidir}/../../tox.ini -e jenkins-agent-k8s-unit {posargs}

[testenv:static]
commands = tox -c {toxinidir}/../../tox.ini -e jenkins-agent-k8s-static {posargs}

[testenv:coverage-report]
commands = tox -c {toxinidir}/../../tox.ini -e jenkins-agent-k8s-coverage-report {posargs}

[testenv:jenkins-agent-k8s-integration]
# Delegate to the monorepo root tox.ini so dependency groups and lockfile are shared.
commands = tox -c {toxinidir}/../../tox.ini -e jenkins-agent-k8s-integration {posargs}
