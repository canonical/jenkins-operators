[tox]
envlist = lint, unit, static, coverage-report
skipsdist = true
skip_missing_interpreters = true

[testenv:lint]
commands = tox -c {toxinidir}/../../tox.ini -e jenkins-agent-lint -- {posargs}

[testenv:unit]
commands = tox -c {toxinidir}/../../tox.ini -e jenkins-agent-unit -- {posargs}

[testenv:static]
commands = tox -c {toxinidir}/../../tox.ini -e jenkins-agent-static -- {posargs}

[testenv:coverage-report]
commands = tox -c {toxinidir}/../../tox.ini -e jenkins-agent-coverage-report -- {posargs}

[testenv:jenkins-agent-integration]
# Delegate to the monorepo root tox.ini so dependency groups and lockfile are shared.
commands = tox -c {toxinidir}/../../tox.ini -e jenkins-agent-integration -- {posargs}
